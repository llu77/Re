# ════════════════════════════════════════════════════════════════════════
# مفردات البحث في الأدلة — مغلقة عمداً
# ════════════════════════════════════════════════════════════════════════
# لا يخرج إلى الشبكة مصطلحٌ ليس في هذا الملف. التوسيع تعديلُ ملف يُراجَع
# كشيفرة، لا اجتهادٌ وقت التشغيل — لأن الاجتهاد وقت التشغيل هو بالضبط الباب
# الذي تخرج منه ملاحظة مريض في سطر عنوان.
#
# `term`  — ما يُرسَل إلى PubMed. إنجليزي، ومحاذٍ لرؤوس MeSH حيث أمكن؛
#           والمطابقة التلقائية في PubMed تتكفّل بالباقي.
# `label` — ما يُعرض للممارس. عربي، ولا يغادر هذا الخادم أبداً.
#
# البذرة: أنواع التأهيل الثمانية في `app.py::REHAB_TYPES` وما يقابلها من
# تشخّصات وتدخّلات شائعة في إعادة التأهيل.
# ════════════════════════════════════════════════════════════════════════

